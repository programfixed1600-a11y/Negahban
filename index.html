<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نگهبان‌یار | ورود</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family: Tahoma, sans-serif; background:#0f172a; color:#e2e8f0;
           display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px; }
    .card { width:100%; max-width:380px; background:#1e293b; padding:24px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
    h1 { margin:0 0 4px; font-size:22px; }
    .muted { color:#94a3b8; margin:0 0 20px; font-size:13px; }
    input, button { width:100%; padding:12px; border-radius:10px; border:1px solid #334155;
                    background:#0f172a; color:#e2e8f0; font-size:15px; margin-bottom:10px; font-family:inherit; }
    input:focus { outline:none; border-color:#3b82f6; }
    button { background:#3b82f6; border:none; cursor:pointer; font-weight:bold; }
    button:hover { background:#2563eb; }
    button.secondary { background:#334155; }
    button.secondary:hover { background:#475569; }
    .msg { min-height:20px; font-size:13px; margin-top:8px; text-align:center; }
    .msg.err { color:#f87171; }
    .msg.ok { color:#4ade80; }
  </style>
</head>
<body>
  <div class="card">
    <h1>نگهبان‌یار</h1>
    <p class="muted">سامانه مدیریت نگهبانی</p>
    <form id="login-form">
      <input type="email" id="email" placeholder="ایمیل" required />
      <input type="password" id="password" placeholder="رمز عبور (حداقل ۶ کاراکتر)" required minlength="6" />
      <button type="submit">ورود</button>
      <button type="button" id="signup-btn" class="secondary">ثبت‌نام</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
