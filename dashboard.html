<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>پنل مدیریت | نگهبان‌یار</title>
  
  <!-- پلاگین تقویم شمسی -->
  <link rel="stylesheet" href="https://unpkg.com/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css" />
  
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
    body { margin:0; background:#0f172a; color:#e2e8f0; display:flex; flex-direction:column; min-height:100vh; }
    header { background:#1e293b; padding:16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; }
    header h1 { margin:0; font-size:18px; }
    header div { display:flex; gap:10px; }
    header button { border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-family:inherit; font-weight:bold; }
    .btn-logout { background:#ef4444; color:white; }
    .btn-schedule { background:#10b981; color:white; }
    
    main { padding:16px; flex:1; max-width:1000px; margin:0 auto; width:100%; display: flex; flex-direction: column; gap: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .card { background:#1e293b; padding:20px; border-radius:12px; border:1px solid #334155; }
    h2 { font-size:15px; margin-top:0; color:#94a3b8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    label { font-size:11px; color:#94a3b8; margin-bottom:4px; display:block; }
    input, select { width:100%; padding:10px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; margin-bottom:10px; font-family:inherit; font-size: 13px; }
    input:focus, select:focus { outline:none; border-color:#3b82f6; }
    button.submit { width:100%; padding:10px; border-radius:8px; border:none; background:#3b82f6; color:white; font-weight:bold; cursor:pointer; font-family:inherit; font-size: 14px; }
    button.submit:hover { background:#2563eb; }
    .item { background:#0f172a; padding:10px; border-radius:8px; margin-bottom:6px; border:1px solid #334155; font-size: 13px; }
    .list-container { max-height: 250px; overflow-y: auto; margin-top: 10px; }
    
    /* استایل تقویم */
    .datepicker-plot-area { font-family: Tahoma, sans-serif !important; }
  </style>
</head>
<body>
  <header>
    <h1>پنل مدیریت نگهبان‌یار</h1>
    <div>
      <button class="btn-schedule" onclick="window.location.href='schedule.html'">مشاهده جدول شیفت‌ها</button>
      <button class="btn-logout" id="logout-btn">خروج</button>
    </div>
  </header>
  
  <main>
    <p style="font-size:13px; color:#94a3b8; margin:0;">کاربر: <span id="user-email"></span></p>

    <div class="grid">
      <div class="card">
        <h2>شرکت‌ها</h2>
        <form id="company-form">
          <input type="text" id="c-name" placeholder="نام شرکت" required />
          <input type="text" id="c-phone" placeholder="شماره تماس" />
          <button type="submit" class="submit">افزودن شرکت</button>
        </form>
        <div id="company-list" class="list-container"></div>
      </div>

      <div class="card">
        <h2>سایت‌ها</h2>
        <form id="site-form">
          <label>انتخاب شرکت مادر:</label>
          <select id="s-company" required></select>
          <input type="text" id="s-name" placeholder="نام سایت" required />
          <input type="text" id="s-address" placeholder="آدرس" />
          <button type="submit" class="submit">افزودن سایت</button>
        </form>
        <div id="site-list" class="list-container"></div>
      </div>

      <div class="card">
        <h2>پرسنل (نگهبان)</h2>
        <form id="guard-form">
          <input type="text" id="g-name" placeholder="نام و نام خانوادگی" required />
          <input type="text" id="g-phone" placeholder="شماره تماس" />
          <button type="submit" class="submit">افزودن نگهبان</button>
        </form>
        <div id="guard-list" class="list-container"></div>
      </div>
    </div>

    <div class="grid" style="grid-template-columns: 1fr 2fr;">
      <div class="card">
        <h2>پست‌های نگهبانی</h2>
        <form id="post-form">
          <label>انتخاب سایت:</label>
          <select id="p-site" required style="margin-bottom:10px;"></select>
          <label>نام پست (مثلاً درب اصلی):</label>
          <input type="text" id="p-name" placeholder="نام پست" required />
          <button type="submit" class="submit">افزودن پست</button>
        </form>
        <div id="post-list" class="list-container" style="display:grid; grid-template-columns: 1fr; gap:10px; margin-top: 15px;"></div>
      </div>

      <div class="card">
        <h2>چینش خودکار شیفت‌ها (گردش ۳ نفره)</h2>
        <form id="shift-form" style="display:flex; flex-direction:column; gap:10px;">
          
          <div style="display:flex; gap:10px;">
            <div style="flex:1;">
              <label>پست نگهبانی:</label>
              <select id="sh-post" required></select>
            </div>
            <div style="flex:1;">
              <label>الگوی چرخش:</label>
              <select id="sh-type" required>
                <option value="24-48">۲۴ ساعت کار - ۴۸ استراحت</option>
                <option value="12-24">۱۲ ساعت کار - ۲۴ استراحت</option>
                <option value="12-12">۱۲ ساعت کار - ۱۲ استراحت</option>
              </select>
            </div>
          </div>

          <label>انتخاب ۳ نگهبان به ترتیب چرخش:</label>
          <div style="display:flex; gap:10px;">
            <select id="sh-guard1" required style="flex:1;"><option value="">نگهبان ۱...</option></select>
            <select id="sh-guard2" required style="flex:1;"><option value="">نگهبان ۲...</option></select>
            <select id="sh-guard3" required style="flex:1;"><option value="">نگهبان ۳...</option></select>
          </div>

          <div style="display:flex; gap:10px; align-items:center;">
            <div style="flex:2;">
              <label>تاریخ و ساعت شروع (کلیک کنید):</label>
              <!-- ورودی تقویم شمسی -->
              <input type="text" id="sh-start" placeholder="انتخاب تاریخ..." readonly style="margin-bottom:0; cursor:pointer; background:#1e293b;" />
            </div>
            <div style="flex:1;">
              <label>تعداد روز:</label>
              <input type="number" id="sh-days" min="1" max="31" value="30" required style="margin-bottom:0;" />
            </div>
          </div>
          
          <button type="submit" class="submit" style="height: 42px; margin-top:5px;">تولید خودکار جدول</button>
        </form>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:10px; margin-bottom:15px;">
        <h2 style="border:none; margin:0; padding:0;">لیست شیفت‌های ثبت شده</h2>
        <div style="display:flex; align-items:center; gap:10px;">
          <label style="margin:0;">فیلتر بر اساس پست:</label>
          <select id="filter-shift-post" onchange="loadShifts()" style="margin:0; width:200px;">
            <option value="">همه پست‌ها</option>
          </select>
        </div>
      </div>
      <div id="shift-list" class="list-container" style="max-height: 400px;"></div>
    </div>
  </main>

  <!-- اسکریپت‌های تقویم -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://unpkg.com/persian-date@1.1.0/dist/persian-date.min.js"></script>
  <script src="https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>

  <script src="config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
