<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>داشبورد | نگهبان‌یار</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family: Tahoma, sans-serif; background:#0f172a; color:#e2e8f0;
           display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px; }
    .card { width:100%; max-width:520px; background:#1e293b; padding:24px; border-radius:16px; }
    h1 { margin:0 0 12px; font-size:20px; }
    p { color:#94a3b8; font-size:14px; }
    button { width:100%; padding:12px; border-radius:10px; border:none; background:#ef4444;
             color:white; font-size:15px; margin-top:16px; cursor:pointer; font-family:inherit; font-weight:bold; }
    button:hover { background:#dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <h1>داشبورد</h1>
    <p id="who">در حال بارگذاری...</p>
    <button id="logout">خروج</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const db = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (!session) return (location.href = "index.html");
      document.getElementById("who").textContent = "خوش آمدی: " + session.user.email;
    })();
    document.getElementById("logout").addEventListener("click", async () => {
      await db.auth.signOut();
      location.href = "index.html";
    });
  </script>
</body>
</html>
