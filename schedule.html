<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>جدول شیفت‌ها | نگهبان‌یار</title>
  
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
    body { margin:0; background:#0f172a; color:#e2e8f0; display:flex; flex-direction:column; min-height:100vh; }
    header { background:#1e293b; padding:16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; }
    header h1 { margin:0; font-size:18px; }
    header div { display:flex; gap:10px; }
    header button { border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-family:inherit; font-weight:bold; }
    .btn-back { background:#334155; color:white; }
    .btn-print { background:#10b981; color:white; }
    main { padding:16px; flex:1; max-width:1000px; margin:0 auto; width:100%; }
    
    .filter-bar { background:#1e293b; padding:15px; border-radius:12px; border:1px solid #334155; margin-bottom:20px; display:flex; align-items:center; gap:15px; }
    .filter-bar label { font-size:14px; color:#94a3b8; }
    .filter-bar select { padding:10px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; font-family:inherit; font-size:14px; flex:1; max-width:300px; }

    .card { background:#1e293b; padding:20px; border-radius:12px; border:1px solid #334155; overflow-x:auto; }
    
    table { width:100%; border-collapse:collapse; margin-top:10px; text-align:center; font-size:14px; }
    th, td { padding:12px 8px; border:1px solid #334155; }
    th { background:#0f172a; color:#94a3b8; font-weight:bold; }
    tr:nth-child(even) { background:#1e293b; }
    tr:nth-child(odd) { background:#162032; }
    
    .guard-color-0 { color: #60a5fa; font-weight:bold; }
    .guard-color-1 { color: #f472b6; font-weight:bold; }
    .guard-color-2 { color: #34d399; font-weight:bold; }

    .empty-msg { text-align:center; color:#94a3b8; padding:20px; }

    @media print {
      body { background: white; color: black; }
      header, .filter-bar { display: none; }
      main { padding: 0; }
      .card { border: none; padding: 0; box-shadow: none; }
      th { background: #eee !important; color: black !important; }
      td { border-color: #ccc !important; }
      tr:nth-child(even), tr:nth-child(odd) { background: white !important; }
      .guard-color-0, .guard-color-1, .guard-color-2 { color: black !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>جدول شیفت‌های نگهبانی</h1>
    <div>
      <button class="btn-back" onclick="window.location.href='dashboard.html'">بازگشت به پنل</button>
      <button class="btn-print" onclick="window.print()">چاپ جدول 🖨️</button>
    </div>
  </header>
  
  <main>
    <!-- نوار فیلتر -->
    <div class="filter-bar">
      <label>انتخاب پست نگهبانی:</label>
      <select id="filter-post" onchange="loadSchedule()">
        <option value="">همه پست‌ها</option>
      </select>
    </div>

    <div class="card">
      <div id="table-container">
        در حال بارگذاری...
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="schedule.js"></script>
</body>
</html>
