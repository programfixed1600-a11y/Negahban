<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>پنل نگهبان | نگهبان‌یار</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
    body { margin:0; background:#0f172a; color:#e2e8f0; display:flex; flex-direction:column; min-height:100vh; }
    header { background:#1e293b; padding:16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; }
    header h1 { margin:0; font-size:18px; }
    header button { background:#ef4444; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-family:inherit; }
    main { padding:16px; flex:1; max-width:600px; margin:0 auto; width:100%; display: flex; flex-direction: column; gap: 15px; }
    .card { background:#1e293b; padding:20px; border-radius:12px; border:1px solid #334155; }
    h2 { font-size:16px; margin-top:0; color:#94a3b8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .shift-item { background:#0f172a; padding:15px; border-radius:8px; margin-bottom:10px; border:1px solid #334155; border-right: 4px solid #3b82f6; }
    .btn-checkin { background:#10b981; width:100%; padding:12px; font-size:15px; font-weight:bold; color:white; border:none; border-radius:8px; margin-top:10px; cursor:pointer; }
    .btn-checkout { background:#f59e0b; width:100%; padding:12px; font-size:15px; font-weight:bold; color:white; border:none; border-radius:8px; margin-top:10px; cursor:pointer; }
    .success-msg { color:#10b981; font-weight:bold; text-align:center; margin-top:10px; }
  </style>
</head>
<body>
  <header>
    <h1>پنل نگهبان</h1>
    <button id="logout-btn">خروج</button>
  </header>
  
  <main>
    <p style="font-size:13px; color:#94a3b8; margin:0;">خوش آمدید: <span id="user-phone"></span></p>

    <div class="card">
      <h2>شیفت‌های من</h2>
      <div id="my-shifts">در حال بارگذاری...</div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="guard.js"></script>
</body>
</html>
